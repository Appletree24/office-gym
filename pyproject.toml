[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "officegym"
version = "0.1.0"
requires-python = ">=3.11"
description = "Deterministic office agent research environment"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
officegym = "officegym.cli:main"

[tool.setuptools.package-data]
"officegym.resources" = ["*.sql", "*.json"]

"officegym.training" = ["verl_checkpoint_sources.json", "verl_loop_sources.json"]
