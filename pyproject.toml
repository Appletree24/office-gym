[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-runtime"
version = "0.2.0"
requires-python = ">=3.11"
description = "Persistent personal assistant runtime with deterministic OfficeGym evaluation"
readme = "README.md"
dependencies = ["jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
officegym = "officegym.cli:main"
personal-agent = "personal_agent.cli:main"

[tool.setuptools.package-data]
"officegym.resources" = ["*.sql", "*.json"]

"officegym.training" = ["verl_checkpoint_sources.json", "verl_loop_sources.json"]
